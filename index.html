<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>採用コンシェルジュ｜のぞみ整形外科</title>

<style>

:root{
  --primary:#78cfc7;
  --primary-dark:#45b5aa;
  --primary-deep:#328f87;
  --primary-soft:#e8f7f5;
  --primary-pale:#dff3f1;

  --warm:#f8eee6;
  --warm2:#f4ddd0;
  --yellow:#f7e8ae;
  --blue:#dcebf3;

  --text:#666a6c;
  --text-dark:#45494b;
  --text-light:#8a8e90;

  --white:#fff;
  --bg:#f7f8f8;
  --border:#e4e7e7;

  --shadow:0 6px 22px rgba(65,95,92,.10);
  --radius:18px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    "YuGothic",
    Meiryo,
    sans-serif;

  color:var(--text);
  background:var(--bg);

  line-height:1.8;
  letter-spacing:.02em;
}

button,
a{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.app{
  max-width:780px;
  min-height:100vh;
  margin:auto;

  background:#fff;

  box-shadow:
    0 0 40px rgba(0,0,0,.04);
}


/* =====================
HEADER
===================== */

.header{
  position:sticky;
  top:0;

  z-index:30;

  background:
    rgba(255,255,255,.96);

  backdrop-filter:
    blur(8px);

  border-bottom:
    1px solid var(--border);
}

.header-inner{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:
    14px 20px;
}

.brand-tagline{
  margin:0 0 2px;

  color:
    var(--primary-deep);

  font-size:10px;

  letter-spacing:.18em;
}

.brand-name{
  margin:0;

  color:
    var(--text-dark);

  font-size:16px;
  font-weight:700;
}

.brand-sub{
  margin:2px 0 0;

  color:
    var(--text-light);

  font-size:11px;
}

.header-mark{
  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:
    2px solid var(--primary);

  border-radius:50%;

  color:
    var(--primary-deep);

  font-weight:700;
}


/* =====================
SCREEN
===================== */

main{
  padding-bottom:225px;
}

.screen{
  display:none;

  min-height:
    calc(100vh - 70px);
}

.screen.active{
  display:block;
}

.screen-inner{
  padding:
    34px 22px 65px;
}

.eyebrow{
  margin-bottom:8px;

  color:
    var(--primary-deep);

  font-size:11px;
  font-weight:700;

  letter-spacing:.16em;
}

.page-title{
  margin:0;

  color:
    var(--text-dark);

  font-size:26px;
  line-height:1.5;
}

.title-line{
  width:76px;
  height:2px;

  margin:
    17px 0 20px;

  background:
    var(--primary);
}

.lead{
  margin:
    0 0 28px;

  font-size:15px;
}

.highlight{
  color:
    var(--primary-dark);

  font-weight:700;
}


/* =====================
BACK
===================== */

.back-button{
  margin:
    0 0 24px;

  padding:0;

  border:0;

  background:
    transparent;

  color:
    var(--primary-deep);

  font-size:14px;
  font-weight:700;

  cursor:pointer;
}


/* =====================
STEP
===================== */

.numbered-heading{
  display:grid;

  grid-template-columns:
    130px 1fr;

  gap:28px;

  align-items:center;

  margin-bottom:18px;
}

.big-number{
  font-family:
    Georgia,
    serif;

  font-size:105px;

  line-height:.9;

  color:
    var(--primary-pale);

  user-select:none;
}


/* =====================
ILLUSTRATION SYSTEM
===================== */

.scene{
  position:relative;

  overflow:hidden;

  margin:
    24px 0 30px;

  border-radius:24px;

  background:
    linear-gradient(
      145deg,
      #f5fbfa,
      #fff
    );

  border:
    1px solid #dceeea;
}

.scene svg{
  display:block;

  width:100%;
  height:auto;
}

.scene.small{
  max-height:220px;
}

.scene.no-border{
  border:none;
  background:transparent;
}

.scene-soft{
  background:
    linear-gradient(
      135deg,
      #edf9f7,
      #fff9f4
    );
}


/* =====================
OPENING
===================== */

.opening-hero{
  min-height:
    calc(100vh - 185px);

  display:flex;

  flex-direction:column;

  justify-content:center;
}

.opening-panel{
  position:relative;

  margin-left:-22px;

  padding:
    32px 24px
    32px 44px;

  border-radius:
    0 34px 34px 0;

  background:
    linear-gradient(
      135deg,
      rgba(232,247,245,.95),
      rgba(255,255,255,.98)
    );
}

.opening-panel::before{
  content:"";

  position:absolute;

  left:0;
  top:0;
  bottom:0;

  width:8px;

  background:
    var(--primary);
}

.opening-title{
  margin:
    0 0 18px;

  color:
    var(--text-dark);

  font-size:30px;

  line-height:1.55;
}

.opening-text{
  margin:
    0 0 20px;

  font-size:15px;
}


/* =====================
BUTTON
===================== */

.primary-button{
  width:100%;

  min-height:56px;

  padding:
    14px 18px;

  border:0;

  border-radius:14px;

  background:
    var(--primary-dark);

  color:#fff;

  font-weight:700;

  cursor:pointer;

  box-shadow:
    0 5px 14px
    rgba(69,181,170,.22);
}


/* =====================
CARDS
===================== */

.card-list{
  display:grid;

  grid-template-columns:1fr;

  gap:14px;
}

.card{
  position:relative;

  width:100%;

  min-height:92px;

  padding:
    17px 52px
    17px 18px;

  border:
    1px solid var(--border);

  border-radius:
    var(--radius);

  background:#fff;

  box-shadow:
    var(--shadow);

  text-align:left;

  cursor:pointer;

  transition:.16s ease;
}

.card::after{
  content:"›";

  position:absolute;

  right:20px;
  top:50%;

  transform:
    translateY(-50%);

  color:
    var(--primary-dark);

  font-size:27px;
}

.card:hover{
  border-color:
    var(--primary);

  background:
    var(--primary-soft);
}

.card-title{
  display:block;

  color:
    var(--text-dark);

  font-size:16px;

  font-weight:700;
}

.card-description{
  display:block;

  margin-top:5px;

  color:
    var(--text-light);

  font-size:12px;
}


/* =====================
THEME
===================== */

.theme-card{
  display:grid;

  grid-template-columns:
    42px 1fr;

  gap:14px;

  align-items:center;

  padding-right:86px;
}

.theme-icon{
  width:38px;
  height:38px;

  display:flex;

  align-items:center;
  justify-content:center;

  color:
    var(--primary-dark);
}

.theme-icon svg{
  width:30px;
  height:30px;

  fill:none;

  stroke:
    currentColor;

  stroke-width:1.8;

  stroke-linecap:round;

  stroke-linejoin:round;
}

.read-badge{
  display:none;

  position:absolute;

  right:42px;
  top:15px;

  color:
    var(--primary-deep);

  font-size:11px;

  font-weight:700;
}

.theme-card.read{
  background:#e2f4f1;

  border-color:#bfe5df;
}

.theme-card.read
.read-badge{
  display:block;
}


/* =====================
PROGRESS
===================== */

.selection-label{
  display:inline-block;

  margin-bottom:18px;

  padding:
    6px 12px;

  border-radius:999px;

  background:
    var(--primary-soft);

  color:
    var(--primary-deep);

  font-size:12px;

  font-weight:700;
}

.progress-area{
  margin-bottom:26px;
}

.progress-text{
  display:flex;

  justify-content:
    space-between;

  margin-bottom:8px;

  font-size:13px;

  font-weight:700;
}

.progress-track{
  height:5px;

  overflow:hidden;

  border-radius:999px;

  background:#edf1f1;
}

.progress-bar{
  width:0%;

  height:100%;

  border-radius:999px;

  background:
    var(--primary-dark);
}


/* =====================
ANSWER
===================== */

.answer-header{
  position:relative;

  padding:
    22px 0 24px;

  margin-bottom:24px;

  border-bottom:
    1px solid var(--border);
}

.answer-number{
  position:absolute;

  top:-36px;
  right:-4px;

  color:
    var(--primary-pale);

  font-family:
    Georgia,
    serif;

  font-size:100px;

  line-height:1;
}

.answer-header-content{
  position:relative;

  z-index:1;
}

.answer-title{
  margin:0;

  color:
    var(--text-dark);

  font-size:26px;

  line-height:1.5;
}

.answer-body{
  font-size:15px;
}

.answer-body h2,
.philosophy-body h2{
  position:relative;

  margin:
    38px 0 14px;

  padding-top:12px;

  color:
    var(--text-dark);

  font-size:19px;
}

.answer-body h2::before,
.philosophy-body h2::before{
  content:"";

  position:absolute;

  top:0;
  left:0;

  width:42px;
  height:2px;

  background:
    var(--primary);
}

.answer-body p,
.philosophy-body p{
  margin:
    0 0 18px;
}

.answer-box{
  margin:
    26px 0;

  padding:20px;

  border-radius:16px;

  background:
    var(--primary-soft);

  border-left:
    5px solid var(--primary);
}


/* =====================
PHILOSOPHY
===================== */

.philosophy-intro{
  margin:
    8px 0 25px;

  padding:22px;

  border-left:
    5px solid var(--primary);

  border-radius:
    0 16px 16px 0;

  background:
    var(--primary-soft);
}

.philosophy-intro strong{
  color:
    var(--primary-deep);
}


/* =====================
FOOTER
===================== */

.cta{
  position:fixed;

  left:50%;
  bottom:0;

  transform:
    translateX(-50%);

  width:
    min(780px,100%);

  z-index:50;

  padding:
    9px 12px
    max(
      10px,
      env(safe-area-inset-bottom)
    );

  border-top:
    1px solid var(--border);

  background:
    rgba(255,255,255,.97);

  backdrop-filter:
    blur(8px);
}

.philosophy-link{
  width:100%;

  margin:
    0 0 9px;

  padding:0;

  border:0;

  background:
    transparent;

  cursor:pointer;
}

.philosophy-link-inner{
  display:flex;

  align-items:center;

  justify-content:
    space-between;

  gap:16px;

  min-height:58px;

  padding:
    12px 17px;

  border:
    1px solid
    rgba(69,181,170,.38);

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #f4fbfa,
      #e7f6f3
    );

  text-align:left;
}

.philosophy-link-label{
  display:block;

  color:
    var(--primary-deep);

  font-size:9px;

  font-weight:700;

  letter-spacing:.18em;
}

.philosophy-link-title{
  display:block;

  color:
    var(--text-dark);

  font-size:14px;

  font-weight:700;
}

.philosophy-link-arrow{
  color:
    var(--primary-dark);

  font-size:25px;
}

.cta-message{
  margin:
    0 0 7px;

  font-size:11px;

  text-align:center;
}

.cta-inner{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;
}

.cta a{
  min-height:50px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:12px;

  text-decoration:none;

  color:
    var(--primary-deep);

  background:
    var(--primary-soft);

  font-size:13px;

  font-weight:700;
}

.cta a:last-child{
  background:
    var(--primary-dark);

  color:#fff;
}


/* =====================
PC
===================== */

@media(min-width:640px){

  .app{
    max-width:900px;
  }

  .header-inner{
    padding:
      16px 42px;
  }

  .screen-inner{
    padding:
      50px 58px 90px;
  }

  .numbered-heading{
    grid-template-columns:
      165px 1fr;

    gap:42px;
  }

  .big-number{
    font-size:150px;
  }

  .page-title{
    font-size:31px;
  }

  .opening-title{
    font-size:36px;
  }

  .opening-panel{
    margin-left:-58px;

    padding-left:78px;
    padding-right:50px;
  }

  .card-list{
    grid-template-columns:
      repeat(2,1fr);
  }

  .card{
    min-height:112px;
  }

  .cta{
    width:
      min(900px,100%);
  }

}

</style>
</head>
