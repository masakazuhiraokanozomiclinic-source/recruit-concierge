<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>採用コンシェルジュ｜のぞみ整形外科</title>

  <style>
    :root{
      --primary:#78cfc7;
      --primary-dark:#45b5aa;
      --primary-deep:#328f87;
      --primary-soft:#e8f7f5;
      --primary-pale:#dff3f1;

      --text:#666a6c;
      --text-dark:#45494b;
      --text-light:#8a8e90;

      --white:#ffffff;
      --bg:#f7f8f8;
      --border:#e4e7e7;

      --shadow:0 6px 22px rgba(65,95,92,.10);
      --radius:18px;
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        "YuGothic",
        "Meiryo",
        sans-serif;
      color:var(--text);
      background:var(--bg);
      line-height:1.8;
      letter-spacing:.02em;
    }

    button,
    a{
      font:inherit;
    }

    button{
      -webkit-tap-highlight-color:transparent;
    }

    .app{
      max-width:780px;
      min-height:100vh;
      margin:0 auto;
      background:var(--white);
      box-shadow:0 0 40px rgba(0,0,0,.04);
    }

    /* =========================
       HEADER
    ========================= */

    .header{
      position:sticky;
      top:0;
      z-index:30;
      background:rgba(255,255,255,.96);
      backdrop-filter:blur(8px);
      border-bottom:1px solid var(--border);
    }

    .header-inner{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      padding:14px 20px;
    }

    .brand{
      min-width:0;
    }

    .brand-tagline{
      margin:0 0 2px;
      color:var(--primary-deep);
      font-size:10px;
      letter-spacing:.18em;
    }

    .brand-name{
      margin:0;
      color:var(--text-dark);
      font-size:16px;
      font-weight:700;
    }

    .brand-sub{
      margin:2px 0 0;
      color:var(--text-light);
      font-size:11px;
    }

    .header-mark{
      width:38px;
      height:38px;
      border:2px solid var(--primary);
      border-radius:50%;
      display:flex;
      justify-content:center;
      align-items:center;
      color:var(--primary-deep);
      font-weight:700;
      flex-shrink:0;
    }

    /* =========================
       MAIN
    ========================= */

    main{
      padding-bottom:225px;
    }

    .screen{
      display:none;
      min-height:calc(100vh - 70px);
    }

    .screen.active{
      display:block;
    }

    .screen-inner{
      padding:34px 22px 60px;
    }

    .eyebrow{
      margin-bottom:8px;
      color:var(--primary-deep);
      font-size:11px;
      font-weight:700;
      letter-spacing:.16em;
    }

    .page-title{
      margin:0;
      color:var(--text-dark);
      font-size:26px;
      line-height:1.5;
      font-weight:700;
    }

    .title-line{
      width:76px;
      height:2px;
      margin:17px 0 20px;
      background:var(--primary);
    }

    .lead{
      margin:0 0 30px;
      color:var(--text);
      font-size:15px;
    }

    .highlight{
      color:var(--primary-dark);
      font-weight:700;
    }

    /* =========================
       BACK
    ========================= */

    .back-button{
      border:0;
      padding:0;
      margin:0 0 24px;
      background:transparent;
      color:var(--primary-deep);
      font-size:14px;
      font-weight:700;
      cursor:pointer;
    }

    /* =========================
       NUMBER + HEADING
    ========================= */

    .numbered-heading{
      display:grid;
      grid-template-columns:130px 1fr;
      gap:28px;
      align-items:center;
      margin-bottom:18px;
    }

    .big-number{
      font-family:Georgia, "Times New Roman", serif;
      font-size:105px;
      line-height:.9;
      font-weight:400;
      color:var(--primary-pale);
      user-select:none;
      text-align:left;
    }

    .heading-text{
      min-width:0;
    }

    /* =========================
       OPENING
    ========================= */

    .opening-hero{
      min-height:calc(100vh - 185px);
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .opening-panel{
      position:relative;
      padding:32px 24px;
      background:
        linear-gradient(
          135deg,
          rgba(232,247,245,.95),
          rgba(255,255,255,.98)
        );
      border-radius:0 34px 34px 0;
      margin-left:-22px;
      padding-left:44px;
    }

    .opening-panel::before{
      content:"";
      position:absolute;
      left:0;
      top:0;
      bottom:0;
      width:8px;
      background:var(--primary);
    }

    .opening-title{
      margin:0 0 18px;
      color:var(--text-dark);
      font-size:30px;
      line-height:1.55;
      font-weight:700;
    }

    .opening-text{
      margin:0 0 28px;
      color:var(--text);
      font-size:15px;
    }

    /* =========================
       BUTTON
    ========================= */

    .primary-button{
      width:100%;
      min-height:56px;
      padding:14px 18px;
      border:none;
      border-radius:14px;
      background:var(--primary-dark);
      color:#fff;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 5px 14px rgba(69,181,170,.22);
      transition:.15s ease;
    }

    .primary-button:active{
      transform:scale(.985);
    }

    /* =========================
       CARDS
    ========================= */

    .card-list{
      display:grid;
      grid-template-columns:1fr;
      gap:14px;
    }

    .card{
      position:relative;
      width:100%;
      min-height:92px;
      padding:17px 52px 17px 18px;
      border:1px solid var(--border);
      border-radius:var(--radius);
      background:var(--white);
      box-shadow:var(--shadow);
      text-align:left;
      cursor:pointer;
      transition:.16s ease;
    }

    .card::after{
      content:"›";
      position:absolute;
      top:50%;
      right:20px;
      transform:translateY(-50%);
      color:var(--primary-dark);
      font-size:27px;
      font-weight:300;
    }

    .card:hover,
    .card:focus-visible{
      border-color:var(--primary);
      background:var(--primary-soft);
      outline:none;
    }

    .card-title{
      display:block;
      color:var(--text-dark);
      font-size:16px;
      font-weight:700;
      line-height:1.55;
    }

    .card-description{
      display:block;
      margin-top:5px;
      color:var(--text-light);
      font-size:12px;
      line-height:1.6;
    }

    /* =========================
       THEME CARD
    ========================= */

    .theme-card{
      display:grid;
      grid-template-columns:42px 1fr;
      gap:14px;
      align-items:center;
      padding-right:86px;
    }

    .theme-card-content{
      min-width:0;
    }

    .theme-icon{
      width:38px;
      height:38px;
      display:flex;
      justify-content:center;
      align-items:center;
      color:var(--primary-dark);
      flex-shrink:0;
    }

    .theme-icon svg{
      width:30px;
      height:30px;
      stroke:currentColor;
      fill:none;
      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .read-badge{
      position:absolute;
      top:15px;
      right:42px;
      display:none;
      color:var(--primary-deep);
      font-size:11px;
      font-weight:700;
    }

    /* 閲覧済みテーマ */

    .theme-card.read{
      background:#e2f4f1;
      border-color:#bfe5df;
    }

    .theme-card.read .read-badge{
      display:block;
    }

    /* =========================
       THEMES
    ========================= */

    .selection-label{
      display:inline-block;
      margin-bottom:18px;
      padding:6px 12px;
      border-radius:999px;
      background:var(--primary-soft);
      color:var(--primary-deep);
      font-size:12px;
      font-weight:700;
    }

    .progress-area{
      margin-bottom:26px;
    }

    .progress-text{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:8px;
      font-size:13px;
      font-weight:700;
      color:var(--text);
    }

    .progress-track{
      height:5px;
      overflow:hidden;
      border-radius:999px;
      background:#edf1f1;
    }

    .progress-bar{
      width:0%;
      height:100%;
      border-radius:999px;
      background:var(--primary-dark);
      transition:.25s ease;
    }

    /* =========================
       ANSWER
    ========================= */

    .answer-header{
      position:relative;
      padding:22px 0 24px;
      margin-bottom:24px;
      border-bottom:1px solid var(--border);
    }

    .answer-number{
      position:absolute;
      top:-36px;
      right:-4px;
      color:var(--primary-pale);
      font-family:Georgia, "Times New Roman", serif;
      font-size:100px;
      line-height:1;
      z-index:0;
    }

    .answer-header-content{
      position:relative;
      z-index:1;
    }

    .answer-title{
      margin:0;
      color:var(--text-dark);
      font-size:26px;
      line-height:1.5;
    }

    .answer-body{
      font-size:15px;
    }

    .answer-body h2{
      position:relative;
      margin:38px 0 14px;
      padding-top:12px;
      color:var(--text-dark);
      font-size:19px;
      line-height:1.5;
    }

    .answer-body h2::before{
      content:"";
      position:absolute;
      top:0;
      left:0;
      width:42px;
      height:2px;
      background:var(--primary);
    }

    .answer-body p{
      margin:0 0 18px;
    }

    .answer-box{
      margin:26px 0;
      padding:20px;
      border-radius:16px;
      background:var(--primary-soft);
      border-left:5px solid var(--primary);
      color:var(--text);
    }

    /* =========================
       FUTURE IMAGE SUPPORT
    ========================= */

    .answer-image{
      display:none;
      margin:24px 0;
    }

    .answer-image.enabled{
      display:block;
    }

    .answer-image img{
      display:block;
      width:100%;
      height:auto;
      border-radius:16px;
    }

    .answer-image-caption{
      margin-top:8px;
      color:var(--text-light);
      font-size:12px;
      line-height:1.6;
    }

    .answer-gallery{
      display:grid;
      gap:18px;
      margin:28px 0 34px;
    }

    .answer-slide{
      display:block;
      width:100%;
      padding:0;
      overflow:hidden;
      border:1px solid var(--border);
      border-radius:16px;
      background:#fff;
      box-shadow:0 7px 22px rgba(56,77,75,.08);
      cursor:zoom-in;
      text-align:left;
    }

    .answer-slide img{
      display:block;
      width:100%;
      height:auto;
    }

    .answer-slide-caption{
      display:block;
      padding:9px 13px;
      color:var(--text-light);
      font-size:12px;
    }

    .image-lightbox{
      position:fixed;
      inset:0;
      z-index:1000;
      display:none;
      align-items:center;
      justify-content:center;
      padding:54px 16px 20px;
      background:rgba(23,34,33,.92);
    }

    .image-lightbox.open{ display:flex; }

    .image-lightbox img{
      max-width:min(1200px,100%);
      max-height:calc(100vh - 74px);
      object-fit:contain;
      border-radius:10px;
      background:#fff;
    }

    .lightbox-close{
      position:absolute;
      top:10px;
      right:14px;
      width:42px;
      height:42px;
      border:0;
      background:transparent;
      color:#fff;
      font-size:34px;
      line-height:1;
      cursor:pointer;
    }

    @media (min-width: 760px){
      .answer-gallery{ grid-template-columns:repeat(2,minmax(0,1fr)); }
    }

    /* =========================
       PHILOSOPHY PAGE
    ========================= */

    .philosophy-intro{
      margin:8px 0 28px;
      padding:22px;
      border-left:5px solid var(--primary);
      background:var(--primary-soft);
      border-radius:0 16px 16px 0;
    }

    .philosophy-intro strong{
      color:var(--primary-deep);
    }

    .philosophy-body{
      font-size:15px;
    }

    .philosophy-body p{
      margin:0 0 18px;
    }

    .philosophy-body h2{
      position:relative;
      margin:38px 0 14px;
      padding-top:12px;
      color:var(--text-dark);
      font-size:19px;
      line-height:1.5;
    }

    .philosophy-body h2::before{
      content:"";
      position:absolute;
      top:0;
      left:0;
      width:42px;
      height:2px;
      background:var(--primary);
    }

    /* =========================
       CTA + PHILOSOPHY BUTTON
    ========================= */

    .cta{
      position:fixed;
      left:50%;
      bottom:0;
      transform:translateX(-50%);
      width:min(780px, 100%);
      z-index:50;
      padding:9px 12px max(10px, env(safe-area-inset-bottom));
      border-top:1px solid var(--border);
      background:rgba(255,255,255,.97);
      backdrop-filter:blur(8px);
    }

    /*
      PhilosophyはFactカードとは別カテゴリー。
      カードではなく「特別な入口」として見せる。
    */

    .philosophy-link{
      width:100%;
      margin:0 0 9px;
      padding:0;
      border:none;
      background:transparent;
      cursor:pointer;
    }

    .philosophy-link-inner{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      min-height:58px;
      padding:12px 17px;
      border:1px solid rgba(69,181,170,.38);
      border-radius:14px;
      background:
        linear-gradient(
          135deg,
          #f4fbfa 0%,
          #e7f6f3 100%
        );
      text-align:left;
      transition:.16s ease;
    }

    .philosophy-link-label{
      display:block;
      margin-bottom:1px;
      color:var(--primary-deep);
      font-size:9px;
      font-weight:700;
      letter-spacing:.18em;
    }

    .philosophy-link-title{
      display:block;
      color:var(--text-dark);
      font-size:14px;
      font-weight:700;
      line-height:1.45;
    }

    .philosophy-link-arrow{
      color:var(--primary-dark);
      font-family:Georgia, serif;
      font-size:25px;
      line-height:1;
      flex-shrink:0;
    }

    .philosophy-link:hover .philosophy-link-inner,
    .philosophy-link:focus-visible .philosophy-link-inner{
      border-color:var(--primary-dark);
      background:#e1f4f1;
      outline:none;
    }

    .cta-message{
      margin:0 0 7px;
      color:var(--text);
      font-size:11px;
      text-align:center;
      line-height:1.5;
    }

    .cta-inner{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }

    .cta a{
      min-height:50px;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:7px 4px;
      border-radius:12px;
      text-decoration:none;
      text-align:center;
      font-size:13px;
      font-weight:700;
      color:var(--primary-deep);
      background:var(--primary-soft);
    }

    .cta a:last-child{
      background:var(--primary-dark);
      color:#fff;
    }

    /* =========================
       PC
    ========================= */

    @media (min-width:640px){

      .app{
        max-width:900px;
      }

      .header-inner{
        padding:16px 42px;
      }

      .screen-inner{
        padding:50px 58px 90px;
      }

      .numbered-heading{
        grid-template-columns:165px 1fr;
        gap:42px;
      }

      .big-number{
        font-size:150px;
      }

      .page-title{
        font-size:31px;
      }

      .opening-title{
        font-size:36px;
      }

      .opening-panel{
        margin-left:-58px;
        padding-left:78px;
        padding-right:50px;
      }

      .card-list{
        grid-template-columns:repeat(2,1fr);
      }

      .card{
        min-height:112px;
      }

      .answer-body,
      .philosophy-body{
        font-size:16px;
      }

      .cta{
        width:min(900px, 100%);
      }

      .cta-message{
        font-size:12px;
      }

      .philosophy-link-title{
        font-size:15px;
      }
    }

    @media (min-width:1000px){

      body{
        padding:28px 0;
      }

      .app{
        border-radius:22px;
        overflow:hidden;
      }

      .header{
        border-radius:22px 22px 0 0;
      }
    }

  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <div class="header-inner">

      <div class="brand">

        <p class="brand-tagline">
          your hope, our hope.
        </p>

        <p class="brand-name">
          のぞみ整形外科グループ
        </p>

        <p class="brand-sub">
          採用コンシェルジュ
        </p>

      </div>

      <div class="header-mark">
        N
      </div>

    </div>

  </header>


  <main>

    <!-- =========================
         OPENING
    ========================== -->

    <section
      id="opening"
      class="screen active"
    >

      <div class="screen-inner opening-hero">

        <div class="opening-panel">

          <div class="eyebrow">
            RECRUIT CONCIERGE
          </div>

          <h1
            id="opening-title"
            class="opening-title"
          ></h1>

          <p
            id="opening-text"
            class="opening-text"
          ></p>

          <button
            id="opening-button"
            class="primary-button"
            onclick="showScreen('jobs')"
          ></button>

        </div>

      </div>

    </section>


    <!-- =========================
         JOB
    ========================== -->

    <section
      id="jobs"
      class="screen"
    >

      <div class="screen-inner">

        <button
          id="job-back-button"
          class="back-button"
          onclick="showScreen('opening')"
        ></button>

        <div class="numbered-heading">

          <div class="big-number">
            01
          </div>

          <div class="heading-text">

            <div class="eyebrow">
              STEP 01
            </div>

            <h1
              id="job-title"
              class="page-title"
            ></h1>

            <div class="title-line"></div>

          </div>

        </div>

        <p
          id="job-lead"
          class="lead"
        ></p>

        <div id="job-list" class="card-list"></div>

      </div>

    </section>


    <!-- =========================
         CAREER
    ========================== -->

    <section
      id="careers"
      class="screen"
    >

      <div class="screen-inner">

        <button
          id="career-back-button"
          class="back-button"
          onclick="showScreen('jobs')"
        ></button>

        <div class="numbered-heading">

          <div class="big-number">
            02
          </div>

          <div class="heading-text">

            <div class="eyebrow">
              STEP 02
            </div>

            <h1
              id="career-title"
              class="page-title"
            ></h1>

            <div class="title-line"></div>

          </div>

        </div>

        <p
          id="career-lead"
          class="lead"
        ></p>

        <div id="career-list" class="card-list"></div>

      </div>

    </section>


    <!-- =========================
         THEMES
    ========================== -->

    <section
      id="themes"
      class="screen"
    >

      <div class="screen-inner">

        <button
          id="theme-back-button"
          class="back-button"
          onclick="showScreen('careers')"
        ></button>

        <div class="numbered-heading">

          <div class="big-number">
            03
          </div>

          <div class="heading-text">

            <div class="eyebrow">
              YOUR GUIDE
            </div>

            <h1
              id="theme-title"
              class="page-title"
            ></h1>

            <div class="title-line"></div>

          </div>

        </div>

        <div
          id="selection-info"
          class="selection-label"
        ></div>

        <p
          id="theme-lead"
          class="lead"
        ></p>

        <div class="progress-area">

          <div class="progress-text">

            <span id="progress-label"></span>

            <span id="progress-text">
              0 / 9
            </span>

          </div>

          <div class="progress-track">

            <div
              id="progress-bar"
              class="progress-bar"
            ></div>

          </div>

        </div>

        <div
          id="theme-list"
          class="card-list"
        ></div>

      </div>

    </section>


    <!-- =========================
         ANSWER
    ========================== -->

    <section
      id="answer"
      class="screen"
    >

      <div class="screen-inner">

        <button
          id="answer-back-button"
          class="back-button"
          onclick="showScreen('themes')"
        ></button>

        <div class="answer-header">

          <div
            id="answer-number"
            class="answer-number"
          >
            01
          </div>

          <div class="answer-header-content">

            <div class="eyebrow">
              ANSWER
            </div>

            <h1
              id="answer-title"
              class="answer-title"
            ></h1>

          </div>

        </div>


        <!-- 将来の画像挿入：上部 -->

        <div
          id="answer-image-top"
          class="answer-image"
        >

          <img
            id="answer-image-top-img"
            src=""
            alt=""
          >

          <div
            id="answer-image-top-caption"
            class="answer-image-caption"
          ></div>

        </div>


        <div
          id="answer-content"
          class="answer-body"
        ></div>

        <div id="answer-gallery" class="answer-gallery"></div>


        <!-- 将来の画像挿入：下部 -->

        <div
          id="answer-image-bottom"
          class="answer-image"
        >

          <img
            id="answer-image-bottom-img"
            src=""
            alt=""

  function escapeHtml(value){
    return String(value || "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function buildThemeContent(theme){
    const lead=theme.lead
      ? `<div class="answer-box">${escapeHtml(theme.lead)}</div>`
      : "";
    const sections=(theme.sections || []).map(section=>`
      <h2>${escapeHtml(section.title)}</h2>
      <p>${escapeHtml(section.body)}</p>
    `).join("");
    return lead + sections;
  }

  function renderAnswerGallery(theme){
    const gallery=document.getElementById("answer-gallery");
    gallery.innerHTML="";
    (theme.images || []).forEach(image=>{
      const button=document.createElement("button");
      button.type="button";
      button.className="answer-slide";
      button.setAttribute("aria-label",`${image.alt || "資料画像"}を拡大`);
      const img=document.createElement("img");
      const source=(window.RECRUIT_ASSETS || {})[image.src] || image.src;
      img.src=new URL(source,document.baseURI).href;
      img.alt=image.alt || "";
      img.loading="eager";
      img.decoding="async";
      const caption=document.createElement("span");
      caption.className="answer-slide-caption";
      caption.textContent=`採用ピッチ資料 ${image.page}ページ（タップで拡大）`;
      button.append(img,caption);
      button.addEventListener("click",()=>openLightbox(img.currentSrc || img.src,image.alt));
      gallery.appendChild(button);
    });
  }

  function openLightbox(src,alt){
    const lightbox=document.getElementById("image-lightbox");
    const image=document.getElementById("lightbox-image");
    image.src=new URL(src,document.baseURI).href;
    image.alt=alt || "";
    lightbox.classList.add("open");
    lightbox.setAttribute("aria-hidden","false");
    document.body.style.overflow="hidden";
  }

  function closeLightbox(){
    const lightbox=document.getElementById("image-lightbox");
    lightbox.classList.remove("open");
    lightbox.setAttribute("aria-hidden","true");
    document.body.style.overflow="";
  }

  document.addEventListener("keydown",event=>{
    if(event.key==="Escape") closeLightbox();
  });


  /*
    ==========================================
    PHILOSOPHY
    ==========================================
  */

  function getCurrentScreen(){

    const current =
      document.querySelector(".screen.active");

    return current
      ? current.id
      : "opening";

  }


  function openPhilosophy(){

    const currentScreen =
      getCurrentScreen();


    if(currentScreen !== "philosophy"){

      previousScreenBeforePhilosophy =
        currentScreen;

    }


    showScreen("philosophy");

  }


  function returnFromPhilosophy(){

    showScreen(
      previousScreenBeforePhilosophy ||
      "opening"
    );

  }


  /*
    ==========================================
    INITIALIZE
    ==========================================
  */

  applyUIText();
  renderJobs();

</script>

</body>
</html>
