<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>採用コンシェルジュ｜のぞみ整形外科</title>

  <style>
    :root{
      --primary:#78cfc7;
      --primary-dark:#45b5aa;
      --primary-deep:#328f87;
      --primary-soft:#e8f7f5;
      --primary-pale:#dff3f1;

      --text:#666a6c;
      --text-dark:#45494b;
      --text-light:#8a8e90;

      --white:#ffffff;
      --bg:#f7f8f8;
      --border:#e4e7e7;

      --shadow:0 6px 22px rgba(65,95,92,.10);
      --radius:18px;
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        "YuGothic",
        "Meiryo",
        sans-serif;
      color:var(--text);
      background:var(--bg);
      line-height:1.8;
      letter-spacing:.02em;
    }

    button,
    a{
      font:inherit;
    }

    button{
      -webkit-tap-highlight-color:transparent;
    }

    .app{
      max-width:780px;
      min-height:100vh;
      margin:0 auto;
      background:var(--white);
      box-shadow:0 0 40px rgba(0,0,0,.04);
    }

    /* HEADER */

    .header{
      position:sticky;
      top:0;
      z-index:30;
      background:rgba(255,255,255,.96);
      backdrop-filter:blur(8px);
      border-bottom:1px solid var(--border);
    }

    .header-inner{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      padding:14px 20px;
    }

    .brand{
      min-width:0;
    }

    .brand-tagline{
      margin:0 0 2px;
      color:var(--primary-deep);
      font-size:10px;
      letter-spacing:.18em;
    }

    .brand-name{
      margin:0;
      color:var(--text-dark);
      font-size:16px;
      font-weight:700;
    }

    .brand-sub{
      margin:2px 0 0;
      color:var(--text-light);
      font-size:11px;
    }

    .header-mark{
      width:38px;
      height:38px;
      border:2px solid var(--primary);
      border-radius:50%;
      display:flex;
      justify-content:center;
      align-items:center;
      color:var(--primary-deep);
      font-weight:700;
      flex-shrink:0;
    }

    /* MAIN */

    main{
      padding-bottom:150px;
    }

    .screen{
      display:none;
      min-height:calc(100vh - 70px);
    }

    .screen.active{
      display:block;
    }

    .screen-inner{
      padding:34px 22px 60px;
    }

    .eyebrow{
      margin-bottom:8px;
      color:var(--primary-deep);
      font-size:11px;
      font-weight:700;
      letter-spacing:.16em;
    }

    .page-title{
      margin:0;
      color:var(--text-dark);
      font-size:26px;
      line-height:1.5;
      font-weight:700;
    }

    .title-line{
      width:76px;
      height:2px;
      margin:17px 0 20px;
      background:var(--primary);
    }

    .lead{
      margin:0 0 30px;
      color:var(--text);
      font-size:15px;
    }

    .highlight{
      color:var(--primary-dark);
      font-weight:700;
    }

    /* BACK */

    .back-button{
      border:0;
      padding:0;
      margin:0 0 24px;
      background:transparent;
      color:var(--primary-deep);
      font-size:14px;
      font-weight:700;
      cursor:pointer;
    }

    /* NUMBER + HEADING */

    .numbered-heading{
      display:grid;
      grid-template-columns:130px 1fr;
      gap:28px;
      align-items:center;
      margin-bottom:18px;
    }

    .big-number{
      font-family:Georgia, "Times New Roman", serif;
      font-size:105px;
      line-height:.9;
      font-weight:400;
      color:var(--primary-pale);
      user-select:none;
      text-align:left;
    }

    .heading-text{
      min-width:0;
    }

    /* OPENING */

    .opening-hero{
      min-height:calc(100vh - 185px);
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .opening-panel{
      position:relative;
      padding:32px 24px;
      background:
        linear-gradient(
          135deg,
          rgba(232,247,245,.95),
          rgba(255,255,255,.98)
        );
      border-radius:0 34px 34px 0;
      margin-left:-22px;
      padding-left:44px;
    }

    .opening-panel::before{
      content:"";
      position:absolute;
      left:0;
      top:0;
      bottom:0;
      width:8px;
      background:var(--primary);
    }

    .opening-title{
      margin:0 0 18px;
      color:var(--text-dark);
      font-size:30px;
      line-height:1.55;
      font-weight:700;
    }

    .opening-text{
      margin:0 0 28px;
      color:var(--text);
      font-size:15px;
    }

    /* BUTTON */

    .primary-button{
      width:100%;
      min-height:56px;
      padding:14px 18px;
      border:none;
      border-radius:14px;
      background:var(--primary-dark);
      color:#fff;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 5px 14px rgba(69,181,170,.22);
      transition:.15s ease;
    }

    .primary-button:active{
      transform:scale(.985);
    }

    /* CARDS */

    .card-list{
      display:grid;
      grid-template-columns:1fr;
      gap:14px;
    }

    .card{
      position:relative;
      width:100%;
      min-height:92px;
      padding:17px 52px 17px 18px;
      border:1px solid var(--border);
      border-radius:var(--radius);
      background:var(--white);
      box-shadow:var(--shadow);
      text-align:left;
      cursor:pointer;
      transition:.16s ease;
    }

    .card::after{
      content:"›";
      position:absolute;
      top:50%;
      right:20px;
      transform:translateY(-50%);
      color:var(--primary-dark);
      font-size:27px;
      font-weight:300;
    }

    .card:hover,
    .card:focus-visible{
      border-color:var(--primary);
      background:var(--primary-soft);
      outline:none;
    }

    .card-title{
      display:block;
      color:var(--text-dark);
      font-size:16px;
      font-weight:700;
      line-height:1.55;
    }

    .card-description{
      display:block;
      margin-top:5px;
      color:var(--text-light);
      font-size:12px;
      line-height:1.6;
    }

    /* THEME CARD ICON */

    .theme-card{
      display:grid;
      grid-template-columns:42px 1fr;
      gap:14px;
      align-items:center;
      padding-right:86px;
    }

    .theme-card-content{
      min-width:0;
    }

    .theme-icon{
      width:38px;
      height:38px;
      display:flex;
      justify-content:center;
      align-items:center;
      color:var(--primary-dark);
      flex-shrink:0;
    }

    .theme-icon svg{
      width:30px;
      height:30px;
      stroke:currentColor;
      fill:none;
      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .read-badge{
      position:absolute;
      top:15px;
      right:42px;
      display:none;
      color:var(--primary-deep);
      font-size:11px;
      font-weight:700;
    }

    .theme-card.read{
      background:#fbfefe;
    }

    .theme-card.read .read-badge{
      display:block;
    }

    /* THEMES */

    .selection-label{
      display:inline-block;
      margin-bottom:18px;
      padding:6px 12px;
      border-radius:999px;
      background:var(--primary-soft);
      color:var(--primary-deep);
      font-size:12px;
      font-weight:700;
    }

    .progress-area{
      margin-bottom:26px;
    }

    .progress-text{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:8px;
      font-size:13px;
      font-weight:700;
      color:var(--text);
    }

    .progress-track{
      height:5px;
      overflow:hidden;
      border-radius:999px;
      background:#edf1f1;
    }

    .progress-bar{
      width:0%;
      height:100%;
      border-radius:999px;
      background:var(--primary-dark);
      transition:.25s ease;
    }

    /* ANSWER */

    .answer-header{
      position:relative;
      padding:22px 0 24px;
      margin-bottom:24px;
      border-bottom:1px solid var(--border);
    }

    .answer-number{
      position:absolute;
      top:-36px;
      right:-4px;
      color:var(--primary-pale);
      font-family:Georgia, "Times New Roman", serif;
      font-size:100px;
      line-height:1;
      z-index:0;
    }

    .answer-header-content{
      position:relative;
      z-index:1;
    }

    .answer-title{
      margin:0;
      color:var(--text-dark);
      font-size:26px;
      line-height:1.5;
    }

    .answer-body{
      font-size:15px;
    }

    .answer-body h2{
      position:relative;
      margin:38px 0 14px;
      padding-top:12px;
      color:var(--text-dark);
      font-size:19px;
      line-height:1.5;
    }

    .answer-body h2::before{
      content:"";
      position:absolute;
      top:0;
      left:0;
      width:42px;
      height:2px;
      background:var(--primary);
    }

    .answer-body p{
      margin:0 0 18px;
    }

    .answer-box{
      margin:26px 0;
      padding:20px;
      border-radius:16px;
      background:var(--primary-soft);
      border-left:5px solid var(--primary);
      color:var(--text);
    }

    /* FUTURE IMAGE SUPPORT */

    .answer-image{
      display:none;
      margin:24px 0;
    }

    .answer-image.enabled{
      display:block;
    }

    .answer-image img{
      display:block;
      width:100%;
      height:auto;
      border-radius:16px;
    }

    .answer-image-caption{
      margin-top:8px;
      color:var(--text-light);
      font-size:12px;
      line-height:1.6;
    }

    /* CTA */

    .cta{
      position:fixed;
      left:50%;
      bottom:0;
      transform:translateX(-50%);
      width:min(780px, 100%);
      z-index:50;
      padding:9px 12px max(10px, env(safe-area-inset-bottom));
      border-top:1px solid var(--border);
      background:rgba(255,255,255,.97);
      backdrop-filter:blur(8px);
    }

    .cta-message{
      margin:0 0 7px;
      color:var(--text);
      font-size:11px;
      text-align:center;
      line-height:1.5;
    }

    .cta-inner{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }

    .cta a{
      min-height:50px;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:7px 4px;
      border-radius:12px;
      text-decoration:none;
      text-align:center;
      font-size:13px;
      font-weight:700;
      color:var(--primary-deep);
      background:var(--primary-soft);
    }

    .cta a:last-child{
      background:var(--primary-dark);
      color:#fff;
    }

    /* PC */

    @media (min-width:640px){

      .app{
        max-width:900px;
      }

      .header-inner{
        padding:16px 42px;
      }

      .screen-inner{
        padding:50px 58px 90px;
      }

      .numbered-heading{
        grid-template-columns:165px 1fr;
        gap:42px;
      }

      .big-number{
        font-size:150px;
      }

      .page-title{
        font-size:31px;
      }

      .opening-title{
        font-size:36px;
      }

      .opening-panel{
        margin-left:-58px;
        padding-left:78px;
        padding-right:50px;
      }

      .card-list{
        grid-template-columns:repeat(2,1fr);
      }

      .card{
        min-height:112px;
      }

      .answer-body{
        font-size:16px;
      }

      .cta{
        width:min(900px, 100%);
      }

      .cta-message{
        font-size:12px;
      }
    }

    @media (min-width:1000px){

      body{
        padding:28px 0;
      }

      .app{
        border-radius:22px;
        overflow:hidden;
      }

      .header{
        border-radius:22px 22px 0 0;
      }
    }

  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="header-inner">

      <div class="brand">
        <p class="brand-tagline">your hope, our hope.</p>
        <p class="brand-name">のぞみ整形外科グループ</p>
        <p class="brand-sub">採用コンシェルジュ</p>
      </div>

      <div class="header-mark">N</div>

    </div>
  </header>


  <main>

    <!-- OPENING -->
    <section id="opening" class="screen active">

      <div class="screen-inner opening-hero">

        <div class="opening-panel">

          <div class="eyebrow">
            RECRUIT CONCIERGE
          </div>

          <h1
            id="opening-title"
            class="opening-title"
          ></h1>

          <p
            id="opening-text"
            class="opening-text"
          ></p>

          <button
            id="opening-button"
            class="primary-button"
            onclick="showScreen('jobs')"
          ></button>

        </div>

      </div>

    </section>


    <!-- JOB -->
    <section id="jobs" class="screen">

      <div class="screen-inner">

        <button
          id="job-back-button"
          class="back-button"
          onclick="showScreen('opening')"
        ></button>

        <div class="numbered-heading">

          <div class="big-number">
            01
          </div>

          <div class="heading-text">

            <div class="eyebrow">
              STEP 01
            </div>

            <h1
              id="job-title"
              class="page-title"
            ></h1>

            <div class="title-line"></div>

          </div>

        </div>

        <p
          id="job-lead"
          class="lead"
        ></p>

        <div class="card-list">

          <button
            class="card"
            onclick="selectJob('理学療法士')"
          >
            <span class="card-title">
              理学療法士
            </span>
            <span class="card-description">
              外来・通所・訪問リハビリテーション
            </span>
          </button>

          <button
            class="card"
            onclick="selectJob('看護師')"
          >
            <span class="card-title">
              看護師
            </span>
            <span class="card-description">
              整形外科クリニックでの看護業務
            </span>
          </button>

          <button
            class="card"
            onclick="selectJob('医療事務')"
          >
            <span class="card-title">
              医療事務
            </span>
            <span class="card-description">
              受付・医療事務・患者対応
            </span>
          </button>

        </div>

      </div>

    </section>


    <!-- CAREER -->
    <section id="careers" class="screen">

      <div class="screen-inner">

        <button
          id="career-back-button"
          class="back-button"
          onclick="showScreen('jobs')"
        ></button>

        <div class="numbered-heading">

          <div class="big-number">
            02
          </div>

          <div class="heading-text">

            <div class="eyebrow">
              STEP 02
            </div>

            <h1
              id="career-title"
              class="page-title"
            ></h1>

            <div class="title-line"></div>

          </div>

        </div>

        <p
          id="career-lead"
          class="lead"
        ></p>

        <div class="card-list">

          <button
            class="card"
            onclick="selectCareer('新卒')"
          >
            <span class="card-title">
              新卒
            </span>
            <span class="card-description">
              学校卒業後、初めて就職する方
            </span>
          </button>

          <button
            class="card"
            onclick="selectCareer('中途')"
          >
            <span class="card-title">
              中途
            </span>
            <span class="card-description">
              実務経験のある方
            </span>
          </button>

          <button
            class="card"
            onclick="selectCareer('ブランクあり')"
          >
            <span class="card-title">
              ブランクあり
            </span>
            <span class="card-description">
              現場復帰を検討している方
            </span>
          </button>

        </div>

      </div>

    </section>


    <!-- THEMES -->
    <section id="themes" class="screen">

      <div class="screen-inner">

        <button
          id="theme-back-button"
          class="back-button"
          onclick="showScreen('careers')"
        ></button>

        <div class="numbered-heading">

          <div class="big-number">
            03
          </div>

          <div class="heading-text">

            <div class="eyebrow">
              YOUR GUIDE
            </div>

            <h1
              id="theme-title"
              class="page-title"
            ></h1>

            <div class="title-line"></div>

          </div>

        </div>

        <div
          id="selection-info"
          class="selection-label"
        ></div>

        <p
          id="theme-lead"
          class="lead"
        ></p>

        <div class="progress-area">

          <div class="progress-text">
            <span id="progress-label"></span>
            <span id="progress-text">0 / 9</span>
          </div>

          <div class="progress-track">
            <div
              id="progress-bar"
              class="progress-bar"
            ></div>
          </div>

        </div>

        <div
          id="theme-list"
          class="card-list"
        ></div>

      </div>

    </section>


    <!-- ANSWER -->
    <section id="answer" class="screen">

      <div class="screen-inner">

        <button
          id="answer-back-button"
          class="back-button"
          onclick="showScreen('themes')"
        ></button>

        <div class="answer-header">

          <div
            id="answer-number"
            class="answer-number"
          >
            01
          </div>

          <div class="answer-header-content">

            <div class="eyebrow">
              ANSWER
            </div>

            <h1
              id="answer-title"
              class="answer-title"
            ></h1>

          </div>

        </div>

        <div
          id="answer-image-top"
          class="answer-image"
        >
          <img
            id="answer-image-top-img"
            src=""
            alt=""
          >

          <div
            id="answer-image-top-caption"
            class="answer-image-caption"
          ></div>
        </div>

        <div
          id="answer-content"
          class="answer-body"
        ></div>

        <div
          id="answer-image-bottom"
          class="answer-image"
        >
          <img
            id="answer-image-bottom-img"
            src=""
            alt=""
          >

          <div
            id="answer-image-bottom-caption"
            class="answer-image-caption"
          ></div>
        </div>

        <button
          id="answer-more-button"
          class="primary-button"
          onclick="showScreen('themes')"
        ></button>

      </div>

    </section>

  </main>

</div>


<!-- CTA -->
<div class="cta">

  <p
    id="cta-message"
    class="cta-message"
  ></p>

  <div class="cta-inner">

    <a
      id="cta-consult"
      href="#"
    ></a>

    <a
      id="cta-visit"
      href="#"
    ></a>

    <a
      id="cta-apply"
      href="#"
    ></a>

  </div>

</div>


<script>

  /*
    将来の 06_UIテキストマスター 連携対象。
    現在は仮データとしてここで管理。
  */

  const uiText = {

    opening_title:
      'あなたの「知りたい」から、<br>職場を少しずつ知ってください。',

    opening_text:
      '仕事内容、教育環境、働き方、職場の雰囲気。<br>求職者の皆さまからよくいただく質問を、気になるテーマから自由に見ることができます。',

    opening_button:
      '採用コンシェルジュをはじめる',

    job_back:
      '← 最初に戻る',

    job_title:
      '希望する職種を<br>選んでください',

    job_lead:
      '現在検討している職種を選択してください。',

    career_back:
      '← 職種選択へ戻る',

    career_title_default:
      'キャリアを選んでください',

    career_lead:
      'あなたに最も近いものを選択してください。',

    theme_back:
      '← キャリア選択へ戻る',

    theme_title:
      '何について<br>知りたいですか？',

    theme_lead:
      '順番はありません。気になるテーマから自由にご覧ください。',

    progress_label:
      '閲覧状況',

    answer_back:
      '← テーマ一覧へ戻る',

    answer_more_button:
      '他のテーマも見る',

    cta_message:
      '相談、見学、応募に関してはこちらから↓',

    cta_consult:
      '相談する',

    cta_visit:
      '見学する',

    cta_apply:
      '応募する'

  };


  /*
    将来はテーママスター・固定回答マスターから取得。
    icon_key / image_* もマスター連携を想定。
  */

  const themes = [

    {
      id:1,
      title:"仕事内容・働き方",
      description:"仕事内容や一日の流れ、働き方について",
      icon_key:"work",

      image_enabled:false,
      image_url:"",
      image_position:"top",
      image_alt:"",
      image_caption:"",

      content:`
        <p>
          ここには
          <span class="highlight">
            「仕事内容・働き方」
          </span>
          についての固定回答が入ります。
        </p>

        <h2>
          どんな仕事をするの？
        </h2>

        <p>
          実際の仕事内容や一日の流れを、

  function showScreen(id){

    document
      .querySelectorAll(".screen")
      .forEach(screen => {
        screen.classList.remove("active");
      });

    document
      .getElementById(id)
      .classList.add("active");

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

    if(id === "themes"){
      renderThemes();
    }

  }


  function selectJob(job){

    selectedJob = job;

    document
      .getElementById("career-title")
      .innerHTML =
      `${job}の<br>キャリアを選んでください`;

    showScreen("careers");

  }


  function selectCareer(career){

    selectedCareer = career;

    document
      .getElementById("selection-info")
      .textContent =
      `${selectedJob} ／ ${selectedCareer}`;

    showScreen("themes");

  }


  function renderThemes(){

    const list =
      document.getElementById("theme-list");

    list.innerHTML = "";

    themes.forEach(theme => {

      const button =
        document.createElement("button");

      button.className =
        "card theme-card" +
        (
          readThemes.has(theme.id)
            ? " read"
            : ""
        );

      button.innerHTML = `
        <span class="theme-icon">
          ${themeIcons[theme.icon_key] || ""}
        </span>

        <span class="theme-card-content">

          <span class="card-title">
            ${theme.title}
          </span>

          <span class="card-description">
            ${theme.description}
          </span>

        </span>

        <span class="read-badge">
          ✓ 閲覧済み
        </span>
      `;

      button.onclick =
        () => openTheme(theme);

      list.appendChild(button);

    });


    const count =
      readThemes.size;

    document
      .getElementById("progress-text")
      .textContent =
      `${count} / ${themes.length}`;

    document
      .getElementById("progress-bar")
      .style.width =
      `${count / themes.length * 100}%`;

  }


  function resetAnswerImages(){

    const top =
      document.getElementById("answer-image-top");

    const bottom =
      document.getElementById("answer-image-bottom");

    top.classList.remove("enabled");
    bottom.classList.remove("enabled");

  }


  function renderAnswerImage(theme){

    resetAnswerImages();

    if(!theme.image_enabled || !theme.image_url){
      return;
    }

    const position =
      theme.image_position === "bottom"
        ? "bottom"
        : "top";

    const wrapper =
      document.getElementById(
        `answer-image-${position}`
      );

    const image =
      document.getElementById(
        `answer-image-${position}-img`
      );

    const caption =
      document.getElementById(
        `answer-image-${position}-caption`
      );

    image.src =
      theme.image_url;

    image.alt =
      theme.image_alt || "";

    caption.textContent =
      theme.image_caption || "";

    wrapper.classList.add("enabled");

  }


  function openTheme(theme){

    readThemes.add(theme.id);

    document
      .getElementById("answer-title")
      .textContent =
      theme.title;

    document
      .getElementById("answer-number")
      .textContent =
      String(theme.id).padStart(2,"0");

    document
      .getElementById("answer-content")
      .innerHTML =
      theme.content || `
        <p>
          ここには
          <span class="highlight">
            「${theme.title}」
          </span>
          についての固定回答が表示されます。
        </p>

        <h2>
          このテーマについて
        </h2>

        <p>
          本番では、
          選択した職種とキャリアに合わせた内容を
          Googleスプレッドシートから取得して表示します。
        </p>

        <div class="answer-box">
          現在はUI確認用の仮文章です。
        </div>
      `;

    renderAnswerImage(theme);

    showScreen("answer");

  }
